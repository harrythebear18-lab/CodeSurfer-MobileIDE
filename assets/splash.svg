<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1280" height="720" fill="#121212"/>
  
  <!-- Grid pattern for code editor feel -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A2A2A" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#grid)"/>
  
  <!-- CodeSurfer logo -->
  <g transform="translate(640, 360)">
    <!-- Main brackets -->
    <path d="M-120 -60 L-200 0 L-120 60" stroke="#2196F3" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120 -60 L200 0 L120 60" stroke="#2196F3" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Code lines -->
    <rect x="-80" y="-20" width="160" height="8" fill="#4CAF50"/>
    <rect x="-80" y="4" width="120" height="8" fill="#FF9800"/>
    <rect x="-80" y="28" width="140" height="8" fill="#2196F3"/>
  </g>
  
  <!-- Title -->
  <text x="640" y="480" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#FFFFFF">CodeSurfer</text>
  <text x="640" y="530" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#888888">Mobile Development Environment</text>
  
  <!-- Loading dots -->
  <circle cx="580" cy="580" r="8" fill="#2196F3">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="580" r="8" fill="#2196F3">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="580" r="8" fill="#2196F3">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSurfer MobileIDE - Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #121212;
            color: #ffffff;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #2196f3;
            margin: 0;
            font-size: 24px;
        }
        .header p {
            color: #888;
            margin: 5px 0 0 0;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            font-size: 16px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2196f3;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #1976d2;
        }
        .admin-toggle {
            margin: 20px 0;
            padding: 10px;
            background: #333;
            border-radius: 6px;
        }
        .admin-toggle label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .admin-toggle input[type="checkbox"] {
            margin-right: 10px;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            background: #333;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }
        .success {
            background: #2e7d32;
        }
        .error {
            background: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CodeSurfer MobileIDE</h1>
            <p>Mobile Development Environment</p>
        </div>

        <div class="admin-toggle">
            <label>
                <input type="checkbox" id="adminMode">
                <span>Admin Mode (Development Only)</span>
            </label>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" value="HarryThompson">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" value="CannaClub1997!">
            </div>
            <button type="submit" class="btn" id="loginBtn">Sign In</button>
        </form>

        <div class="status" id="status">
            Ready to test CodeSurfer MobileIDE
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const adminMode = document.getElementById('adminMode');
        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const status = document.getElementById('status');

        // Update label based on admin mode
        adminMode.addEventListener('change', () => {
            const label = username.previousElementSibling;
            if (adminMode.checked) {
                label.textContent = 'Username (Admin)';
                username.placeholder = 'Enter admin username';
            } else {
                label.textContent = 'Username';
                username.placeholder = 'Enter username';
            }
        });

        // Handle login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            status.textContent = 'Signing in...';
            status.className = 'status';

            // Simulate login process
            setTimeout(() => {
                if (adminMode.checked && username.value === 'HarryThompson' && password.value === 'CannaClub1997!') {
                    status.textContent = '✅ Admin login successful! Ready to access all features.';
                    status.className = 'status success';
                    
                    // Simulate navigation to main app
                    setTimeout(() => {
                        showAppFeatures();
                    }, 2000);
                } else if (!adminMode.checked && username.value && password.value) {
                    status.textContent = '✅ User login successful! Limited access mode.';
                    status.className = 'status success';
                    
                    setTimeout(() => {
                        showAppFeatures();
                    }, 2000);
                } else {
                    status.textContent = '❌ Login failed. Please check your credentials.';
                    status.className = 'status error';
                }
            }, 1000);
        });

        function showAppFeatures() {
            const features = `
                <h3>🎉 CodeSurfer MobileIDE Features:</h3>
                <ul style="text-align: left; padding: 0 20px;">
                    <li>✅ Code Editor with Monaco</li>
                    <li>✅ File Manager with Permissions</li>
                    <li>✅ Git Integration</li>
                    <li>✅ Terminal Access</li>
                    <li>✅ AI Debugger</li>
                    <li>✅ Search & Replace</li>
                    <li>✅ Real Compiler</li>
                    <li>✅ Plugin System</li>
                    <li>✅ Cloud Sync</li>
                    <li>✅ Firebase Authentication</li>
                </ul>
                <p style="margin-top: 20px; color: #4CAF50;">
                    🚀 App is ready for testing on Android emulator!
                </p>
            `;
            
            document.querySelector('.container').innerHTML = features;
        }

        // Initialize
        console.log('🚀 CodeSurfer MobileIDE Test Interface Loaded');
        console.log('📱 Ready to test login functionality');
    </script>
</body>
</html>
